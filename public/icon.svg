<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="iconBg" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F2F6F3" />
    </radialGradient>

    <!-- Text path for "Camposol" arc -->
    <path id="camposolArc" d="M 85 245 A 190 190 0 0 1 427 245" fill="none" />
    
    <!-- Clip path for the central inner circle field & sun -->
    <clipPath id="fieldCircleClip">
      <circle cx="256" cy="290" r="114" />
    </clipPath>

    <!-- Soft drop shadow for badge -->
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0E381A" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- App Icon Squircle Background -->
  <rect width="512" height="512" rx="112" fill="url(#iconBg)" />
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="#E2EBE5" stroke-width="3" />

  <!-- Camposol Circular Badge Group -->
  <g filter="url(#badgeShadow)">
    <!-- Outer Golden Ring (as in uploaded Image 1) -->
    <circle cx="256" cy="256" r="216" fill="#58A33E" stroke="#B89F67" stroke-width="13" />

    <!-- Inner Soft Accent Ring -->
    <circle cx="256" cy="256" r="208" fill="none" stroke="#68B24C" stroke-width="1.5" opacity="0.6" />

    <!-- Curved "Camposol®" Text -->
    <text fill="#FFFFFF" font-family="'Century Gothic', 'Montserrat', 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="56" letter-spacing="1">
      <textPath href="#camposolArc" startOffset="50%" text-anchor="middle">
        Camposol<tspan font-size="24" dy="-22">®</tspan>
      </textPath>
    </text>

    <!-- Central Field & Sun Graphic (clipped to inner circle) -->
    <g clip-path="url(#fieldCircleClip)">
      <rect x="130" y="160" width="252" height="260" fill="#58A33E" />

      <!-- Golden Sun rising behind the hill -->
      <circle cx="256" cy="250" r="30" fill="#F8A51D" stroke="#E5900C" stroke-width="1" />

      <!-- Rolling Green Hill Base -->
      <path d="M 130 300 Q 220 255 382 286 L 382 410 L 130 410 Z" fill="#58A33E" />

      <!-- Agricultural Furrows -->
      <path d="M 200 350 Q 214 302 238 276 Q 233 280 190 358 Z" fill="#0C6534" />
      <path d="M 222 390 Q 229 322 248 272 Q 242 274 212 394 Z" fill="#0C6534" />
      <path d="M 252 402 Q 250 330 257 270 Q 251 272 243 402 Z" fill="#0C6534" />
      <path d="M 285 402 Q 274 330 268 270 Q 274 272 295 402 Z" fill="#0C6534" />
      <path d="M 322 394 Q 301 332 278 274 Q 284 276 332 388 Z" fill="#0C6534" />
      <path d="M 352 368 Q 325 324 286 282 Q 292 284 360 356 Z" fill="#0C6534" />
    </g>

    <!-- Central Circle White Border Ring -->
    <circle cx="256" cy="290" r="102" fill="none" stroke="#FFFFFF" stroke-width="5.5" />
  </g>
</svg>
